name: Compatibility report
description: An OpenCode event, permission mode or callback maps differently than documented
title: "compat: "
labels: ["compatibility", "needs reproduction"]
body:
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.5.2"
    validations:
      required: true
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      placeholder: "2.2.6"
    validations:
      required: true
  - type: dropdown
    id: generation
    attributes:
      label: OpenCode generation
      options:
        - V2
        - V1
    validations:
      required: true
  - type: input
    id: event
    attributes:
      label: Claude/OpenCode event
      placeholder: "permission.asked"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Event mapping
        - Inline keyboard / callback
        - Tap-only approval guarantee
        - Message formatting
        - Rate limiting / retries
        - V1 legacy adapter
        - Other
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Redacted options
      description: Do not paste your bot token or a private chat id; replace them with placeholders.
      render: jsonc
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed mapping
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected mapping
    validations:
      required: true
