name: upstream-watch

# Self-maintenance loop: when a newer OpenCode release lands, open a
# compatibility issue, verify the plugin against that exact version, and
# prepare the docs update as a pull request. The README anchor
# ("tested on X.Y.Z;") moves only through a PR, merged by a human; merging the
# PR closes the issue.
#
# Threat model: the verification job downloads and executes an upstream binary,
# so it gets a read-only token and never sees a write credential. The publish
# job has write access, runs no upstream code and installs no dependencies.
# The check and failure jobs only call the GitHub API. Actions are pinned by
# commit SHA; Dependabot keeps them current.
#
# Repository prerequisite: Actions > General must allow GitHub Actions to
# create pull requests. Keep the default workflow token read-only; every job
# below declares its own permissions.
#
# Note on the upstream version source: OpenCode publishes tags for both the v1
# and v2 lines (and GitHub releases for current v2 versions). Reading tags
# covers both lines and does not depend on a release being present. A tag can
# precede its release assets; when that happens the check comments once on the
# issue and verification waits for the next daily run.

on:
  schedule:
    - cron: "30 4 * * *" # daily 04:30 UTC
  workflow_dispatch:

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      tested: ${{ steps.detect.outputs.tested }}
      latest: ${{ steps.detect.outputs.latest }}
      newer: ${{ steps.detect.outputs.newer }}
      equal: ${{ steps.detect.outputs.equal }}
      issue: ${{ steps.issue.outputs.number }}
      pr: ${{ steps.pr.outputs.number }}
      assets: ${{ steps.assets.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect versions
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The version this plugin was last contract-checked against lives in the README.
          tested=$(grep -oE "tested on [0-9]+\.[0-9]+\.[0-9]+;" README.md | head -1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" || true)
          # Newest plain semver tag across both v1 and v2 lines.
          latest=$(gh api 'repos/anomalyco/opencode/tags?per_page=100' --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 | sed 's/^v//')
          if [ -z "$tested" ]; then
            echo "::error::README 'tested on X.Y.Z;' anchor not found; the watchdog cannot work until it is restored"
            exit 1
          fi
          newer=false
          equal=false
          if [ "$latest" = "$tested" ]; then
            equal=true
          elif [ "$(printf '%s\n%s\n' "$tested" "$latest" | sort -V | tail -1)" = "$latest" ]; then
            newer=true
          else
            echo "::warning::latest upstream tag $latest is older than the tested anchor $tested; ignoring"
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "newer=$newer" >> "$GITHUB_OUTPUT"
          echo "equal=$equal" >> "$GITHUB_OUTPUT"

      - name: Close non-target compatibility pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.detect.outputs.newer == 'true' && steps.detect.outputs.latest || steps.detect.outputs.tested }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,headRefName,author,isCrossRepository \
            --jq '.[] | "\(.number)\t\(.author.login)\t\(.isCrossRepository)\t\(.headRefName)"' \
            | while IFS=$'\t' read -r n author cross head; do
                case "$head" in
                  compat/opencode-[0-9]*.[0-9]*.[0-9]*-*) ;;
                  *) continue ;;
                esac
                v=$(printf '%s' "$head" | sed -E 's#^compat/opencode-([0-9]+\.[0-9]+\.[0-9]+)-.*#\1#')
                [ "$v" != "$TARGET" ] || continue
                case "$author" in
                  "github-actions[bot]"|"app/github-actions")
                    if [ "$cross" = "false" ]; then
                      gh pr close "$n" --repo "$GITHUB_REPOSITORY" --delete-branch \
                        --comment "Superseded by OpenCode v$TARGET." < /dev/null
                    else
                      gh pr close "$n" --repo "$GITHUB_REPOSITORY" \
                        --comment "Superseded by OpenCode v$TARGET." < /dev/null
                    fi
                    ;;
                  *)
                    gh pr close "$n" --repo "$GITHUB_REPOSITORY" \
                      --comment "Superseded by OpenCode v$TARGET." < /dev/null
                    ;;
                esac
              done

      - name: Find or open the compatibility issue
        id: issue
        if: steps.detect.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="v${{ steps.detect.outputs.latest }}"
          title="Review compatibility with OpenCode $latest"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label github_actions --limit 100 --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' \
            | awk -F'\t' -v t="$title" '$2==t && !found {print $1; found=1}')
          if [ -z "$number" ]; then
            gh label create github_actions --repo "$GITHUB_REPOSITORY" \
              --color "0E8A16" --description "Opened by a GitHub Actions workflow" 2>/dev/null || true
            notes=$(gh release view "$latest" --repo anomalyco/opencode --json body --jq '.body // "" | .[0:6000]' 2>/dev/null || echo "(no GitHub release for this tag — see https://github.com/anomalyco/opencode/tags)")
            {
              echo "New OpenCode release: **$latest**."
              echo ""
              echo "The plugin is currently contract-checked against OpenCode ${{ steps.detect.outputs.tested }}."
              echo ""
              echo "Compatibility checklist:"
              echo "- [ ] permission events and \`client.permission.reply\` (\`decision\` field)"
              echo "- [ ] form events (\`form.created/replied/cancelled\`) and any new plugin form reply surface (upstream: anomalyco/opencode#51108)"
              echo "- [ ] session lifecycle events and activity types used for debounce"
              echo "- [ ] plugin client surface changes (options, location, event.subscribe)"
              echo "- [ ] session info usage fields (cost/tokens) and any plugin-visible usage limits surface"
              echo ""
              echo "Release notes (first 6000 chars):"
              echo '```'
              printf '%s\n' "$notes"
              echo '```'
            } > /tmp/upstream-issue.md
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file /tmp/upstream-issue.md \
              --label "github_actions")
            number=${url##*/}
          fi
          case "$number" in
            ''|*[!0-9]*) echo "::error::could not resolve the compatibility issue number"; exit 1 ;;
          esac
          echo "number=$number" >> "$GITHUB_OUTPUT"
          # Only the newest release is actionable: close older compatibility issues.
          latest_num="${latest#v}"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label github_actions --limit 100 --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' \
            | while IFS=$'\t' read -r n t; do
                case "$t" in
                  "Review compatibility with OpenCode v"[0-9]*)
                    if [ "$t" = "$title" ]; then
                      if [ "$n" != "$number" ]; then
                        gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason "not planned" \
                          --comment "Duplicate of #$number." < /dev/null
                      fi
                      continue
                    fi
                    v=$(printf '%s' "$t" | sed -E 's/^Review compatibility with OpenCode v([0-9]+\.[0-9]+\.[0-9]+)$/\1/')
                    if [ "$t" != "Review compatibility with OpenCode v$v" ]; then
                      continue
                    fi
                    if [ "$(printf '%s\n%s\n' "$v" "$latest_num" | sort -V | tail -1)" = "$latest_num" ]; then
                      gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason "not planned" \
                        --comment "Superseded by $latest; the active issue is #$number." < /dev/null
                    fi
                    ;;
                esac
              done

      - name: Check release assets
        id: assets
        if: steps.detect.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.detect.outputs.latest }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          # The verify job downloads the linux asset and SHA256SUMS from the release.
          # A tag can exist before those assets are published, so a missing release
          # means "not ready yet", not a failed run. Any other lookup error is real.
          available=false
          if assets=$(gh api "repos/anomalyco/opencode/releases/tags/v${VERSION}" \
            --jq '.assets[].name' 2>&1); then
            if printf '%s\n' "$assets" | grep -xE 'opencode-linux-(x64|arm64)\.tar\.gz' > /dev/null \
              && printf '%s\n' "$assets" | grep -x 'SHA256SUMS' > /dev/null; then
              available=true
            fi
          elif [[ "$assets" != *"HTTP 404"* ]]; then
            printf '%s\n' "$assets"
            echo "::error::could not read the release assets for v${VERSION}"
            exit 1
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" = "false" ]; then
            marker="<!-- upstream-watch:assets-pending:v${VERSION} -->"
            bodies=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json comments \
              --jq '.comments[].body' 2>/dev/null || true)
            case "$bodies" in
              *"$marker"*) ;;
              *)
                gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          $marker
          OpenCode v${VERSION} is tagged but its release assets are not published yet, so verification cannot start. The next daily run retries; this comment is posted once per version.

          Release: https://github.com/anomalyco/opencode/releases/tag/v${VERSION}
          EOF
          )"
                ;;
            esac
          fi

      - name: Check for an open compatibility pull request
        id: pr
        if: steps.detect.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.detect.outputs.latest }}
        run: |
          set -euo pipefail
          prefix="compat/opencode-${LATEST}-"
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,headRefName,baseRefName,author,isCrossRepository \
            --jq '.[] | "\(.number)\t\(.author.login)\t\(.isCrossRepository)\t\(.baseRefName)\t\(.headRefName)"' \
            | awk -F'\t' -v p="$prefix" \
                '($2=="github-actions[bot]" || $2=="app/github-actions") && $3=="false" && $4=="main" && index($5,p)==1 && !found {print $1; found=1}')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Reconcile already-verified issues
        if: steps.detect.outputs.equal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tested="${{ steps.detect.outputs.tested }}"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label github_actions --limit 100 --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' \
            | while IFS=$'\t' read -r n t; do
                v=$(printf '%s' "$t" | sed -E 's/^Review compatibility with OpenCode v([0-9]+\.[0-9]+\.[0-9]+)$/\1/')
                if [ "$t" != "Review compatibility with OpenCode v$v" ]; then
                  continue
                fi
                if [ "$v" = "$tested" ]; then
                  gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
                    --body "Already verified on OpenCode $tested; the README anchor matches. Closing." < /dev/null
                  gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed < /dev/null
                elif [ "$(printf '%s\n%s\n' "$v" "$tested" | sort -V | tail -1)" = "$tested" ]; then
                  gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
                    --body "Superseded by OpenCode $tested; the README anchor is newer. Closing." < /dev/null
                  gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason "not planned" < /dev/null
                fi
              done

  verify:
    needs: check
    if: |
      github.ref == 'refs/heads/main' &&
      needs.check.outputs.newer == 'true' &&
      needs.check.outputs.issue != '' &&
      needs.check.outputs.pr == '' &&
      needs.check.outputs.assets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install OpenCode ${{ needs.check.outputs.latest }}
        env:
          VERSION: ${{ needs.check.outputs.latest }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) asset="opencode-linux-x64.tar.gz" ;;
            aarch64|arm64) asset="opencode-linux-arm64.tar.gz" ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/anomalyco/opencode/releases/download/v${VERSION}/${asset}"
          curl -fsSL "$url" -o /tmp/opencode.tar.gz
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${VERSION}/SHA256SUMS" -o /tmp/SHA256SUMS
          expected=$(grep -E "  ${asset}$" /tmp/SHA256SUMS | awk '{print $1}')
          actual=$(sha256sum /tmp/opencode.tar.gz | awk '{print $1}')
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::release asset checksum mismatch for $asset"
            exit 1
          fi
          members=$(tar -tzf /tmp/opencode.tar.gz)
          if printf '%s\n' "$members" | grep -Eq '^/|(^|/)\.\.(/|$)'; then
            echo "::error::release asset contains an unsafe path"
            exit 1
          fi
          if tar -tvzf /tmp/opencode.tar.gz | grep -Eq '^[lh]'; then
            echo "::error::release asset contains a symlink or hardlink"
            exit 1
          fi
          mkdir -p /tmp/opencode-dist
          tar -xzf /tmp/opencode.tar.gz --no-same-owner --no-same-permissions -C /tmp/opencode-dist
          binary=$(find /tmp/opencode-dist -type f -name opencode -perm -u+x | head -1)
          if [ -z "$binary" ]; then
            echo "::error::opencode binary not found in the v$VERSION release asset"
            exit 1
          fi
          actual=$("$binary" --version | grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::installed OpenCode $actual, expected $VERSION"
            exit 1
          fi
          echo "OPENCODE_BIN=$binary" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Compatibility check
        run: bun run compat

  publish:
    needs: [check, verify]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.check.outputs.newer == 'true' &&
      needs.check.outputs.issue != '' &&
      needs.check.outputs.pr == '' &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare the anchor branch
        id: mark
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          VERSION: ${{ needs.check.outputs.latest }}
          ISSUE: ${{ needs.check.outputs.issue }}
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"
          branch="compat/opencode-${VERSION}-${RUN_ID}"
          git switch -c "$branch"
          sed -i -E "s/tested on [0-9]+\.[0-9]+\.[0-9]+;/tested on ${VERSION};/" README.md
          anchors=$(grep -oE "tested on [0-9]+\.[0-9]+\.[0-9]+;" README.md | wc -l | tr -d ' ' || true)
          if [ "$anchors" != "1" ]; then
            echo "::error::README must contain exactly one tested-on anchor, found $anchors"
            exit 1
          fi
          git add README.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            names=$(git diff --cached --name-only)
            if [ "$names" != "README.md" ]; then
              echo "::error::staged files are not exactly README.md: $names"
              exit 1
            fi
            stat=$(git diff --cached --numstat -- README.md)
            if [ "$stat" != $'1\t1\tREADME.md' ]; then
              echo "::error::README diff is not a single-line anchor update: $stat"
              git diff --cached
              exit 1
            fi
            added=$(git diff --cached --unified=0 -- README.md | grep -E '^\+' | grep -v '^+++' || true)
            if [ "$(printf '%s\n' "$added" | wc -l | tr -d ' ')" != "1" ] \
              || ! printf '%s\n' "$added" | grep -qF "tested on $VERSION;"; then
              echo "::error::added line is not exactly the tested-on anchor for $VERSION"
              git diff --cached
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -c core.hooksPath=/dev/null commit -m "chore: mark tested on OpenCode $VERSION (compat #$ISSUE)"
            commit_sha=$(git rev-parse HEAD)
            if [ "$(git rev-list --count "$BASE_SHA"..HEAD)" != "1" ] \
              || [ "$(git diff --name-only "$BASE_SHA" HEAD)" != "README.md" ] \
              || [ "$(git diff --numstat "$BASE_SHA" HEAD)" != $'1\t1\tREADME.md' ]; then
              echo "::error::commit is not a single README anchor change on top of $BASE_SHA"
              git show --stat "$commit_sha"
              exit 1
            fi
            gh auth setup-git
            git -c core.hooksPath=/dev/null push origin "$commit_sha:refs/heads/$branch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the pull request and comment
        id: pr
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.check.outputs.issue }}
          VERSION: ${{ needs.check.outputs.latest }}
          CHANGED: ${{ steps.mark.outputs.changed }}
          BRANCH: ${{ steps.mark.outputs.branch }}
          COMMIT: ${{ steps.mark.outputs.commit }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" != "true" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
              "Already verified on OpenCode v$VERSION; the README anchor matches. Closing."
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
            exit 0
          fi
          body=$(cat <<EOF
          Marks the plugin as verified against OpenCode v$VERSION.

          - \`bun run ci\` — pass (lint, typecheck, tests)
          - \`bun run smoke\` — pass against the real v$VERSION binary
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This PR changes only the README \`tested on\` anchor.

          Closes #$ISSUE
          EOF
          )
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "chore: mark tested on OpenCode v$VERSION" --body "$body")
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          ### Compatibility verified — OpenCode v$VERSION

          - \`bun run ci\` — pass (lint, typecheck, tests)
          - \`bun run smoke\` — pass against the real v$VERSION binary
          - Pull request: $url (docs-only, commit $COMMIT)
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Merging the PR moves the README anchor and closes this issue. The watchdog will not reopen it for v$VERSION.
          EOF
          )"

      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.check.outputs.issue }}
          VERSION: ${{ needs.check.outputs.latest }}
          PUSHED: ${{ steps.mark.outputs.pushed }}
          CHANGED: ${{ steps.mark.outputs.changed }}
        run: |
          if [ "$PUSHED" = "true" ]; then
            state="The anchor branch was pushed, but creating the pull request or commenting failed. The anchor on main is unchanged."
          elif [ "$CHANGED" = "false" ]; then
            state="The README anchor was already current, but a follow-up step failed."
          else
            state="The anchor branch could not be published. The anchor on main is unchanged; the next run retries."
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          ### Upstream-watch publish failure — OpenCode v$VERSION

          $state

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

  report-failure:
    needs: [check, verify]
    if: |
      !cancelled() &&
      needs.verify.result == 'failure' &&
      needs.check.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment the failure on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.check.outputs.issue }}
          VERSION: ${{ needs.check.outputs.latest }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          ### Compatibility verification failed — OpenCode v$VERSION

          The install, test suite or live smoke did not pass, so no pull request was opened and the anchor on main is unchanged. The next daily run retries.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"
