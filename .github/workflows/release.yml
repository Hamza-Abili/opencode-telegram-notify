name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: CI (typecheck + tests)
        run: bun run ci

      - name: Tag must match package version
        run: |
          version=$(bun -e "const p = require('./package.json'); console.log(p.version)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version v$version" >&2
            exit 1
          fi

      - name: GitHub release
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not set - skipping npm publish (add it in Repo Settings -> Secrets and variables -> Actions to enable npm distribution)"
            exit 0
          fi
          version=$(npm pkg get version | tr -d '"')
          if npm view "@hamzaabili/opencode-telegram-notify@$version" version >/dev/null 2>&1; then
            echo "::notice::$version is already published - skipping npm publish"
            exit 0
          fi
          npm publish --access public
